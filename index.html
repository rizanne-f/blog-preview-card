<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">

    <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
    <article class="blog-preview">
        <img src="./assets/images/illustration-article.svg" alt="HTML & CSS Foundations Preview" class="preview-image">

        <div class="card-content">
            <a href="#" class="blog-tag">Learning</a>
            <p class="date-published">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
            
            <header>
                <h3 class="blog-title"><a href="#">HTML & CSS foundations</a></h3>
            </header>
            <p class="blog-description">
                These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
        </div>

        <footer class="blog-author">
            <a href="#">
                <img src="./assets/images/image-avatar.webp" alt="Greg Hooper Avatar" class="blog-author-image">
                <div class="blog-author-name">Greg Hooper</div>
            </a>
        </footer>
    </article>

    <!-- <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">Rizanne Fernandez</a>.
    </footer> -->
</body>
</html>
