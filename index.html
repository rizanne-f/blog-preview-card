<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="./style.css">

    <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
    <article class="blog-preview">
        <img src="./assets/images/illustration-article.svg" alt="Preview Image" class="preview-image">

        <div class="card-content">
            <div class="blog-tag">Learning</div>
            <div class="date-published">Published <time datetime="2023-12-21">21 Dec 2023</time></div>
            <h3 class="blog-title">HTML & CSS foundations</h3>
            <p class="blog-description">
                These languages are the backbone of every website, defining structure, content, and presentation.
            </p>
        </div>

        <footer>
            <div class="blog-author">
                <img src="./assets/images/image-avatar.webp" alt="Blog Author Avatar" class="blog-author-image">
                <div class="blog-author-name">Greg Hooper</div>
            </div>
        </footer>
    </article>

    <!-- <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">Rizanne Fernandez</a>.
    </footer> -->
</body>
</html>
